# SonarCloud configuration.
# NOTE: confirm these two match your SonarCloud project (Administration > "Project Key"
# and the organization slug). They are pre-filled with the conventional GitHub-derived values.
sonar.projectKey=LuaScale_symfony-api
sonar.organization=luascale

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage & test execution reports produced by PHPUnit in the tests workflow.
# The container-absolute "/app/" prefix is stripped in CI before the scan runs.
sonar.php.coverage.reportPaths=var/coverage/clover.xml
sonar.php.tests.reportPath=var/coverage/junit.xml

sonar.exclusions=vendor/**,var/**,config/**,migrations/**,public/**
sonar.coverage.exclusions=tests/**,src/DataFixtures/**,src/Kernel.php
